<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>admin - 발신자 등록</title>
<style>
:root{--bg:#0f1115;--ink:#f2f3f5;--muted:#9aa3af;--line:#2a2f38;--accent:#4f7cff;--ok:#3ecf7a;--warn:#ffb84d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.card{width:min(92vw,520px);background:#151920;border:1.5px solid var(--line);border-radius:16px;padding:34px 30px}
h1{font-size:1.4rem;margin-bottom:.5rem}
.sub{color:var(--muted);line-height:1.75;margin-bottom:1.3rem;font-size:.93rem}
button{font:inherit;width:100%;padding:.8rem 1rem;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-top:.4rem}
button:disabled{opacity:.5;cursor:wait}
#logoutBtn{background:#242a33;display:none}
.box{margin-top:1.1rem;padding:.9rem 1rem;border-radius:10px;background:#101720;border-left:4px solid var(--accent);font-size:.92rem;line-height:1.75;display:none}
.box.ok{border-left-color:var(--ok)}
.box.warn{border-left-color:var(--warn)}
.who{font-weight:700}
code{background:#232936;padding:.1em .35em;border-radius:4px;font-size:.85em}
</style>
</head>
<body>
<div class="card">
  <h1>admin - 발신자 등록</h1>
  <p class="sub">여기서 Google 로그인(동의)을 마치면,<br>
  그 계정이 이 서비스의 <b>이메일 발신자</b>로 등록됩니다.<br>
  동의 항목에 "나를 대신하여 이메일 전송"이 포함됩니다.</p>

  <button id="loginBtn" disabled>준비 중...</button>
  <button id="logoutBtn">로그아웃</button>

  <div class="box" id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* 이 파일에는 열쇠가 하나도 없습니다.
   주소와 공개 키는 서버(/api/config)가 Vercel 환경변수에서 읽어 내려줍니다.
   그래서 파일을 고치지 않고 그대로 배포하면 됩니다. */

const statusBox = document.getElementById("status");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

function show(msg, cls) {
  statusBox.className = "box " + (cls || "");
  statusBox.style.display = "block";
  statusBox.innerHTML = msg;
}

(async () => {
  // 1) 서버에서 설정 받아오기
  let cfg;
  try {
    const r = await fetch("/api/config");
    cfg = await r.json();
    if (!r.ok || !cfg.url) throw new Error(cfg.error || "설정 없음");
  } catch (e) {
    loginBtn.textContent = "설정을 불러오지 못했습니다";
    show(`Vercel 환경변수 <code>SUPABASE_URL</code> 과 <code>SUPABASE_ANON_KEY</code> 를 넣고<br>다시 배포하세요. (${e.message})`, "warn");
    return;
  }

  // 2) 받은 설정으로 클라이언트 만들기
  const sb = supabase.createClient(cfg.url, cfg.anonKey);
  loginBtn.disabled = false;
  loginBtn.textContent = "Google로 로그인하고 발신자 되기";

  /* 발신자 등록에는 gmail.send 동의가 필요해서 scopes 를 추가로 요청한다.
     access_type=offline + prompt=consent 여야 refresh token 이 내려온다. */
  loginBtn.onclick = () => sb.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/admin.html",
      scopes: "https://www.googleapis.com/auth/gmail.send",
      queryParams: { access_type: "offline", prompt: "consent" }
    }
  });
  logoutBtn.onclick = () => sb.auth.signOut().then(() => location.reload());

  sb.auth.onAuthStateChange(async (_event, session) => {
    if (!session) return;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "block";
    const email = session.user.email;

    if (session.provider_refresh_token) {
      show(`<span class="who">${email}</span> 로그인됨. 발신자 등록 중...`);
      try {
        const r = await fetch("/api/register-sender", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + session.access_token
          },
          body: JSON.stringify({ refresh_token: session.provider_refresh_token })
        });
        const d = await r.json();
        if (r.ok && d.ok) {
          show(`발신자 등록 완료. 이제 <span class="who">${d.sender}</span> 명의로<br>등록 완료·알림 메일이 나갑니다.`, "ok");
        } else {
          show(`등록 거부: ${d.error || "알 수 없는 오류"}`, "warn");
        }
      } catch {
        show("등록 서버에 닿지 못했습니다.", "warn");
      }
    } else {
      show(`<span class="who">${email}</span> 로그인됨.<br>이 세션에는 발신 토큰이 없습니다 - 이미 등록돼 있다면 그대로 동작합니다.<br>재등록하려면 로그아웃 후 다시 로그인하세요.`);
    }
  });
})();
</script>
</body>
</html>
